<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Vedic numerology grid</title><desc id="desc">A traditional three by three numerology grid showing 3, 1, 9, 6, 7, 5, 2, 8, 4.</desc><defs><linearGradient id="paper" x2=".9" y2="1"><stop stop-color="#f2e8d3"/><stop offset="1" stop-color="#d7c7a4"/></linearGradient><linearGradient id="line" x2="0" y2="1"><stop stop-color="#987149"/><stop offset="1" stop-color="#6a4831"/></linearGradient></defs><rect width="1024" height="1024" fill="#17130d"/><rect x="84" y="84" width="856" height="856" rx="10" fill="url(#paper)"/><rect x="110" y="110" width="804" height="804" rx="5" fill="none" stroke="#806044" stroke-opacity=".45" stroke-width="2"/><path d="M352 202v620M672 202v620M202 352h620M202 672h620" stroke="url(#line)" stroke-width="3"/><path d="M202 202h620v620H202z" fill="none" stroke="#7d5a3d" stroke-width="4"/><g fill="#31271c" font-family="Georgia,serif" font-size="112" text-anchor="middle" dominant-baseline="central"><text x="278" y="278">3</text><text x="512" y="278">1</text><text x="746" y="278">9</text><text x="278" y="512">6</text><text x="512" y="512">7</text><text x="746" y="512">5</text><text x="278" y="746">2</text><text x="512" y="746">8</text><text x="746" y="746">4</text></g><g fill="#a27e4e"><circle cx="165" cy="165" r="5"/><circle cx="859" cy="165" r="5"/><circle cx="165" cy="859" r="5"/><circle cx="859" cy="859" r="5"/></g></svg>